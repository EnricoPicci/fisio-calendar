# The local stack's containers (docs/architecture.md §11.4): DynamoDB Local and Mailpit.
# `pnpm local:up` starts them and waits for both to be healthy, then creates the table;
# `pnpm local:down` stops them. CI runs the same file. Ports bind to 127.0.0.1 only.
name: fisio-local

services:
  dynamodb:
    # Pinned by digest as well as tag (Dependabot's docker-compose updates bump both).
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    # -sharedDb: one database for every access key and region, so the API, the tools and the
    # specs see the same tables. -inMemory: nothing survives `local:down`; `pnpm seed` rebuilds.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Any HTTP answer (DynamoDB Local returns 400 to a bare GET) means the server is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      # No reverse DNS of the SMTP client: inside Docker the lookup can stall a send for seconds.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:1025:1025" # SMTP, used by SmtpEmailChannel (WP0.6)
      - "127.0.0.1:8025:8025" # web UI and REST API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
