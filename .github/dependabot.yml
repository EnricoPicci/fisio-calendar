version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node 22 Lambda runtime (architecture §4.3), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      aws:
        patterns: ["aws-cdk*", "@aws-sdk/*", "@aws-lambda-powertools/*", "aws-*"]
      tooling:
        dependency-type: development
      runtime:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
