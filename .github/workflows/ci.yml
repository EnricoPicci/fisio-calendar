# CI (docs/architecture.md §11.3). The `test` job runs exactly what a laptop runs: `pnpm test`,
# the complete local suite (Vitest, then Playwright against `pnpm dev`), against the same Docker
# containers (DynamoDB Local, Mailpit).
# `deploy-dev` / `smoke-dev` (needs: test) and `deploy-prod` arrive with WP0.10.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only, so a push to main never cancels an in-progress main run.
  # A queued main run can still be superseded; WP0.10 gives the deploy jobs their own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (Dependabot keeps them current), so a retagged action
      # cannot reach the AWS deploy role that WP0.10 adds to this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # The Playwright binding journeys (part of `pnpm test`) need a browser.
      - name: Install Chromium for Playwright
        run: pnpm --filter @fisio/e2e exec playwright install --with-deps chromium

      - name: Start local containers (DynamoDB Local, Mailpit)
        run: pnpm local:up

      - run: pnpm test

      # A binding journey that fails only in CI leaves its Playwright trace (retain-on-failure).
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # `pnpm test` renders docs/journeys.md from the headless journeys; the committed copy must
      # be the one this code produces (`git status`, not `git diff`: an uncommitted or deleted
      # copy fails too).
      - name: docs/journeys.md is up to date
        run: test -z "$(git status --porcelain -- docs/journeys.md)"
