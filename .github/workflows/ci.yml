# CI (docs/architecture.md §11.3). The `test` job runs exactly what a laptop runs: `pnpm test`,
# the complete local suite, against the same Docker containers (DynamoDB Local, Mailpit).
# `deploy-dev` / `smoke-dev` (needs: test) and `deploy-prod` arrive with WP0.10.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only: a push to main must never cancel a deploy job (WP0.10).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (Dependabot keeps them current), so a retagged action
      # cannot reach the AWS deploy role that WP0.10 adds to this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Start local containers (DynamoDB Local, Mailpit)
        # The compose file lands with WP0.3; until then the suite needs no containers.
        if: hashFiles('tools/local/docker-compose.yml') != ''
        run: pnpm local:up

      - run: pnpm test
